#debug: true

spring:
  application:
    name: mcp-client-demo

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      model:
        gpt-5.2:
          max-tokens: 2000
          temperature: 0.7
          top-p: 1.0
    mcp:
      client:
        enabled: true
        stdio:
          servers-configuration: classpath:mcp-server.json