<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>MCP AI Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #0f172a, #020617);
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar h4 {
            font-weight: 600;
            margin-bottom: 20px;
        }

        .new-chat {
            background: #3b82f6;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            color: white;
            margin-bottom: 20px;
        }

        /* Main */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 18px;
            font-weight: 500;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
        }

        .user {
            justify-content: flex-end;
        }

        .bot {
            justify-content: flex-start;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 14px;
            max-width: 65%;
            font-size: 14px;
            line-height: 1.6;
        }

        .user .bubble {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
        }

        .bot .bubble {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .input-wrapper {
            display: flex;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 8px;
        }

        input {
            flex: 1;
            background: transparent !important;
            border: none !important;
            color: white !important;
        }

        input:focus {
            outline: none;
        }

        button {
            background: #3b82f6;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
        }

        .typing {
            opacity: 0.6;
            font-style: italic;
        }

        /* Scrollbar */
        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <div class="sidebar">
        <h4>🤖 MCP AI</h4>
        <button class="new-chat" onclick="clearChat()">+ New Chat</button>
        <small style="opacity:0.6;">Spring AI + MCP Demo</small>
    </div>

    <!-- Main -->
    <div class="main">

        <div class="header">
            MCP AI Assistant 🚀
        </div>

        <div id="chat-box" class="chat-box"></div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Ask anything...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

    </div>

</div>

<script>
    async function sendMessage() {
        let input = document.getElementById("user-input");
        let msg = input.value.trim();

        if (!msg) return;

        appendMessage(msg, "user");
        input.value = "";

        let typing = appendMessage("Thinking...", "bot", true);

        try {
            let res = await fetch(`/mcp-client/send?message=${encodeURIComponent(msg)}`);
            let data = await res.text();

            typing.remove();
            appendMessage(data, "bot");

        } catch (e) {
            typing.remove();
            appendMessage("⚠️ Server error", "bot");
        }
    }

    function appendMessage(text, type, isTyping=false) {
        let chat = document.getElementById("chat-box");

        let msgDiv = document.createElement("div");
        msgDiv.className = "message " + type;

        let bubble = document.createElement("div");
        bubble.className = "bubble";

        if (isTyping) bubble.classList.add("typing");

        bubble.innerText = text;

        msgDiv.appendChild(bubble);
        chat.appendChild(msgDiv);

        chat.scrollTop = chat.scrollHeight;

        return msgDiv;
    }

    function clearChat() {
        document.getElementById("chat-box").innerHTML = "";
    }

    document.getElementById("user-input")
        .addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });
</script>

</body>
</html>
